<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Jobsite note</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #111;
        color: #f3f3f3;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: #bdbdbd;
      }
      textarea,
      input,
      button {
        width: 100%;
        font: inherit;
      }
      textarea,
      input {
        background: #1c1c1c;
        color: inherit;
        border: 1px solid #3a3a3a;
        border-radius: 0.6rem;
        padding: 0.85rem;
      }
      textarea {
        min-height: 12rem;
        resize: vertical;
      }
      button {
        margin-top: 0.75rem;
        background: #f4c15d;
        color: #111;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.9rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-top: 0.75rem;
      }
      .row input {
        flex: 1;
      }
      .ghost {
        background: transparent;
        color: #bdbdbd;
        border: 1px solid #3a3a3a;
        margin-top: 0;
        width: auto;
        padding: 0.55rem 0.8rem;
      }
      #status {
        min-height: 1.4rem;
        margin-top: 0.85rem;
      }
      a {
        color: #f4c15d;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>What happened on site?</h1>
      <p>Hold your Wispr Flow hotkey, talk, then file the note. It categorizes into Notion automatically.</p>
      <form id="note-form">
        <textarea id="text" name="text" required autofocus placeholder="Painters on the sales floor, second coat started..."></textarea>
        <input id="project" name="project" value="Store 1184" aria-label="Project" />
        <button id="submit" type="submit">File note</button>
      </form>
      <p id="status"></p>
      <form id="key-form" class="hidden">
        <p>Paste CLASSIFY_SECRET once. It stays on this computer.</p>
        <div class="row">
          <input id="secret" type="password" autocomplete="off" />
          <button class="ghost" type="submit">Save</button>
        </div>
      </form>
      <p><button id="change-key" class="ghost" type="button">Change key</button></p>
    </main>
    <script>
      const SECRET_KEY = "classify-secret";
      const form = document.getElementById("note-form");
      const keyForm = document.getElementById("key-form");
      const text = document.getElementById("text");
      const project = document.getElementById("project");
      const status = document.getElementById("status");
      const submit = document.getElementById("submit");
      const secretInput = document.getElementById("secret");

      function secret() {
        return localStorage.getItem(SECRET_KEY) ?? "";
      }

      function showKeyForm(show) {
        keyForm.classList.toggle("hidden", !show);
        if (show) secretInput.focus();
        else text.focus();
      }

      if (!secret()) showKeyForm(true);

      keyForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = secretInput.value.trim();
        if (!value) return;
        localStorage.setItem(SECRET_KEY, value);
        secretInput.value = "";
        showKeyForm(false);
        status.textContent = "Key saved. Dictate, then file.";
      });

      document.getElementById("change-key").addEventListener("click", () => {
        showKeyForm(true);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const key = secret();
        if (!key) {
          showKeyForm(true);
          status.textContent = "Save the classify key first.";
          return;
        }
        const body = {
          text: text.value.trim(),
          project: project.value.trim(),
        };
        if (!body.text) return;
        submit.disabled = true;
        status.textContent = "Filing...";
        try {
          const response = await fetch("/api/classify", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Classify-Secret": key,
            },
            body: JSON.stringify(body),
          });
          const raw = await response.text();
          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            throw new Error("File failed");
          }
          if (!response.ok) {
            throw new Error(data.error || "File failed");
          }
          text.value = "";
          status.innerHTML =
            "Filed as <strong>" +
            data.folder +
            "</strong>. <a href=\"" +
            data.url +
            "\" target=\"_blank\" rel=\"noreferrer\">Open in Notion</a>";
          text.focus();
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "File failed";
        } finally {
          submit.disabled = false;
        }
      });

      text.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
